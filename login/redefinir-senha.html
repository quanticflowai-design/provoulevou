<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Redefinir senha | Provou Levou</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f3fa;color:#211b30;font:16px system-ui,sans-serif}main{width:100%;max-width:420px;padding:32px;background:white;border:1px solid #e7e0ef;border-radius:20px;box-shadow:0 12px 40px #2414340a}.brand{color:#8950d8;font-weight:750;margin:0 0 28px}h1{font-size:25px;margin:0 0 12px}p{line-height:1.5;color:#655d70}label{display:block;font-size:14px;font-weight:600;margin:20px 0 7px}input{width:100%;font:inherit;padding:12px;border:1px solid #cfc7d9;border-radius:9px}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #d5bbf6;outline-offset:2px}button{width:100%;margin-top:24px;padding:13px;background:#8041cb;border:0;border-radius:9px;color:white;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{font-size:14px}a{color:#7034b6}small{display:block;margin-top:7px;color:#756a80}
  </style>
  <script src="../env.js"></script>
</head>
<body>
<main>
  <p class="brand">provoulevou.</p>
  <h1>Crie sua nova senha</h1>
  <p>Escolha uma senha para acessar sua dashboard.</p>
  <form id="form">
    <label for="password">Nova senha</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>
    <small>Use pelo menos 8 caracteres.</small>
    <label for="confirmation">Confirme a nova senha</label>
    <input id="confirmation" type="password" autocomplete="new-password" minlength="8" required>
    <button id="submit" type="submit">Salvar nova senha</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <a id="login" href="/login/" hidden>Acessar minha dashboard</a>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  let tokenHash = params.get('token_hash');
  let accessToken = null;
  history.replaceState(null, '', location.pathname);
  const form = document.getElementById('form');
  const status = document.getElementById('status');
  const button = document.getElementById('submit');
  const config = window.ENV;
  if (!tokenHash || !config?.SUPABASE_URL || !config?.SUPABASE_KEY) {
    form.hidden = true;
    status.textContent = 'Link ausente ou inválido. Solicite um novo link à equipe Provou Levou.';
    return;
  }
  const request = async (path, body, token, method = 'POST') => {
    const response = await fetch(config.SUPABASE_URL + '/auth/v1/' + path, {
      method, headers: { 'Content-Type': 'application/json', apikey: config.SUPABASE_KEY,
        ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: JSON.stringify(body)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(path === 'verify'
      ? 'Este link expirou ou já foi utilizado. Solicite um novo link.'
      : 'Não foi possível salvar a senha. Tente uma senha diferente e envie novamente.');
    return result;
  };
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    if (password !== document.getElementById('confirmation').value) {
      status.textContent = 'As senhas precisam ser iguais.'; return;
    }
    button.disabled = true;
    status.textContent = 'Salvando sua nova senha…';
    try {
      if (!accessToken) {
        const session = await request('verify', { token_hash: tokenHash, type: 'recovery' });
        accessToken = session.access_token;
        if (!accessToken) throw new Error('Não foi possível validar este link. Solicite um novo link.');
        tokenHash = null;
      }
      await request('user', { password }, accessToken, 'PUT');
      accessToken = null;
      form.reset(); form.hidden = true;
      status.textContent = 'Senha alterada com sucesso! Entre com seu e-mail e sua nova senha.';
      document.getElementById('login').hidden = false;
    } catch (error) {
      status.textContent = error instanceof TypeError ? 'Falha de conexão. Tente novamente.' : error.message;
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
