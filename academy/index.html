<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Provou Academy</title>
<link rel="icon" type="image/jpeg" href="../assets/favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
<script src="../env.js"></script>
<style>
@font-face{font-family:'HelveticaNow';src:url('../helveticanowdisplay-medium.ttf') format('truetype');font-weight:500;font-display:swap}
:root{--bg:#f4f3f7;--card:#fff;--line:#e7e4ee;--txt:#18161f;--txt2:#5d596a;--txt3:#9893a5;--roxo:#7c3aed;--roxo2:#6d28d9;--lil:#f0e9fe;--ok:#047857;--okbg:#ecfdf5;--ouro:#a16207;--ourobg:#fef3c7;--red:#b91c1c;--redbg:#fee2e2}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.hn{font-family:'HelveticaNow','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.02em}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px}
.hd img{height:26px}.hd .ac{font-weight:600;color:var(--roxo);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
.hd .r{margin-left:auto;display:flex;gap:12px;align-items:center;color:var(--txt2)}
.hd .r a{font-size:13.5px;font-weight:500}
.av{width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none;background:var(--lil);color:var(--roxo2)}
.av.of{background:var(--roxo);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:220px 1fr 320px;gap:22px;align-items:start}
.lado{position:sticky;top:84px}
.lado a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-weight:500;font-size:14.5px;color:var(--txt2)}
.lado a.on{background:#fff;color:var(--roxo2);box-shadow:0 1px 2px rgba(20,10,40,.06)}
.lado h5{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin:20px 12px 6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.compor textarea{width:100%;border:0;background:var(--bg);border-radius:12px;padding:12px 14px;font:inherit;resize:vertical;min-height:52px;color:var(--txt)}
.compor .op{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
select,input[type=text],input[type=url],input[type=datetime-local],input[type=email],input[type=password],input[type=number]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;background:#fff;color:var(--txt)}
.btn{border:0;border-radius:11px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.pri{background:var(--roxo);color:#fff}.pri:disabled{opacity:.5}.sec{background:var(--lil);color:var(--roxo2)}.gh{background:none;color:var(--txt2);padding:6px 8px}
.chips{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}.chip{font-size:13px;font-weight:500;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--txt2)}.chip.on{background:var(--txt);border-color:var(--txt);color:#fff}
.post{margin-top:14px}
.ph{display:flex;gap:12px;align-items:center}.ph b{font-size:14.5px}.ph .meta{font-size:12.5px;color:var(--txt3)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px;white-space:nowrap}
.b-of{background:var(--lil);color:var(--roxo2)}.b-case{background:var(--ourobg);color:var(--ouro)}.b-duv{background:var(--okbg);color:var(--ok)}.b-live{background:var(--redbg);color:var(--red)}
.post .tx{font-size:14.5px;line-height:1.6;margin:12px 0;white-space:pre-wrap;word-wrap:break-word}
.vid{border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#000}.vid iframe{width:100%;height:100%;border:0}
.evc{border-radius:14px;padding:20px;color:#fff;background:radial-gradient(500px 220px at 85% 10%,rgba(196,181,253,.55),transparent),linear-gradient(135deg,#4c1d95,#7c3aed);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.evc .q{flex:1;min-width:200px}.evc .q b{display:block;font-size:17px}.evc .q span{opacity:.85;font-size:13.5px}
.evc .btn{background:#fff;color:var(--roxo2)}
.num{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num div{background:var(--lil);border-radius:12px;padding:12px}.num b{display:block;font-size:20px;color:var(--roxo2)}.num span{font-size:12px;color:var(--txt2)}
.acts{display:flex;gap:6px;margin-top:10px;color:var(--txt3);font-size:13.5px;align-items:center;flex-wrap:wrap}
.acts button{background:none;border:0;color:inherit;display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:8px}.acts button:hover{background:var(--bg)}
.acts .liked{color:#db2777}.acts .resp{color:var(--roxo);font-weight:600;margin-left:4px;display:flex;gap:5px;align-items:center}
.acts .adm{margin-left:auto}
.coms{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.com{display:flex;gap:10px;margin-bottom:12px}.com .bx{background:var(--bg);border-radius:12px;padding:8px 12px;flex:1}.com .bx b{font-size:13px}.com .bx div{font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.com .av{width:30px;height:30px;font-size:11px}
.novo{display:flex;gap:8px}.novo input{flex:1}
.dir .card{margin-bottom:16px}.dir h3{font-size:15.5px;margin:0 0 12px}
.meu{background:linear-gradient(140deg,#6d28d9,#a78bfa);color:#fff;border:0}
.meu .v{font-size:30px;margin:4px 0}.br{height:8px;border-radius:99px;background:rgba(255,255,255,.25);margin:12px 0 6px}.br i{display:block;height:100%;border-radius:99px;background:#fff}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}.ev:first-of-type{border-top:0;padding-top:0}
.dt{width:46px;flex:none;text-align:center;background:var(--bg);border-radius:10px;padding:5px 0}.dt b{display:block;font-size:17px}.dt span{font-size:10.5px;color:var(--txt3);text-transform:uppercase}
.ev h4{margin:0;font-size:14px}.ev p{margin:2px 0 0;font-size:12.5px;color:var(--txt3)}
.sino{margin-left:auto;background:none;border:0;color:var(--txt3);font-size:18px;padding:4px}.sino.on{color:var(--roxo)}
.rk{display:flex;align-items:center;gap:10px;padding:7px 0}.rk .p{width:20px;font-weight:700;color:var(--txt3);font-size:13px}.rk b{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk .pl{font-size:12px;font-weight:600;white-space:nowrap}
.vazio{color:var(--txt3);font-size:14px;text-align:center;padding:28px 10px}
.trilha{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;margin-top:16px}
.trilha .pl{width:56px;height:56px;margin:0 auto 8px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid var(--line);color:var(--txt3);background:#fff}
.trilha .ok .pl{background:var(--roxo);border-color:var(--roxo);color:#fff}.trilha .at .pl{border:2px dashed var(--roxo);background:var(--lil);color:var(--roxo)}
.trilha b{display:block;font-size:14px}.trilha small{font-size:11.5px;color:var(--txt3)}
.aula{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}.aula:first-child{border-top:0}
.aula .ic{width:44px;height:44px;border-radius:12px;background:var(--lil);color:var(--roxo);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.aula.vista .ic{background:var(--okbg);color:var(--ok)}
.aula h4{margin:0;font-size:14.5px}.aula p{margin:2px 0 0;font-size:12.5px;color:var(--txt3)}
.form{display:grid;gap:8px}.form label{font-size:12.5px;color:var(--txt2)}
.auth{max-width:420px;margin:8vh auto;padding:0 16px}
.auth input{width:100%;margin-top:4px}
.err{color:var(--red);font-size:13.5px;margin-top:10px}
.af-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.af-stats .card{padding:14px}.af-stats span{font-size:12.5px;color:var(--txt2)}.af-stats b{display:block;font-size:21px;margin-top:2px}
.af-regra{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.af-regra div{background:var(--bg);border-radius:12px;padding:12px}.af-regra b{display:block;font-size:20px;color:var(--roxo2)}.af-regra span{font-size:12.5px;color:var(--txt2)}
.linkbox{display:flex;gap:8px}.linkbox input{flex:1;min-width:0}
.treewrap{overflow-x:auto;padding:6px 0 4px}.tree{display:flex;justify-content:center;min-width:max-content}
.tree ul{position:relative;display:flex;justify-content:center;margin:0;padding:22px 0 0}
.tree li{list-style:none;position:relative;padding:22px 6px 0;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:22px;border-top:1.5px solid #cfcbd9}
.tree li::after{right:auto;left:50%;border-left:1.5px solid #cfcbd9}
.tree li:only-child::before,.tree li:only-child::after{border-top:0}.tree li:first-child::before,.tree li:last-child::after{border-top:0}
.tree li:last-child::before{border-right:1.5px solid #cfcbd9;border-radius:0 8px 0 0}.tree li:first-child::after{border-radius:8px 0 0 0}.tree li:only-child::after{border-radius:0}
.tree ul ul::before{content:'';position:absolute;top:0;left:50%;height:22px;border-left:1.5px solid #cfcbd9}
.tree>ul{padding-top:0}.tree>ul>li{padding-top:0}.tree>ul>li::before,.tree>ul>li::after{display:none}
.no{width:140px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 8px;text-align:center}
.no .av{margin:0 auto 6px;width:32px;height:32px;font-size:12px}.no .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no .tg{font-size:11px;color:var(--txt3)}.no .vl{font-size:14.5px;font-weight:700;margin-top:4px}.no .ds{font-size:11px;color:var(--txt2)}
.no.raiz{border-color:var(--roxo);box-shadow:0 0 0 3px var(--lil)}.no.raiz .av{background:var(--roxo);color:#fff}.no.raiz .vl{color:var(--roxo2)}
.no.n2 .av{background:var(--okbg);color:var(--ok)}.no.n2 .vl{color:var(--ok)}.no.n3 .av{background:var(--ourobg);color:var(--ouro)}.no.n3 .vl{color:var(--ouro)}
.no.vazio{border-style:dashed;color:var(--txt3);font-size:12.5px;padding:14px 8px}
.tab{width:100%;border-collapse:collapse;font-size:13.5px}.tab th{text-align:left;font-weight:500;color:var(--txt2);font-size:12px;padding:8px;border-bottom:1px solid var(--line)}.tab td{padding:9px 8px;border-bottom:1px solid var(--line)}.tab .n{text-align:right;white-space:nowrap}
@media(max-width:1000px){.af-stats{grid-template-columns:1fr 1fr}.af-regra{grid-template-columns:1fr}.no{width:112px}}
.hide{display:none!important}
.vidv{width:min(340px,100%);aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#000;margin:10px 0 4px}.vidv video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
/* dentro da dash do lojista (iframe): sem o cabeçalho próprio */
html.embed header{display:none}html.embed .lado,html.embed .dir{top:16px}html.embed .wrap{max-width:none;padding:22px 30px 40px;grid-template-columns:240px minmax(0,1fr) 340px;gap:26px}@media(max-width:1000px){html.embed .wrap{grid-template-columns:1fr;padding:16px}}
.mbar{display:none}
@media(max-width:1000px){.wrap{grid-template-columns:1fr;padding:16px}.lado,.dir{position:static}.lado{display:none}.mbar{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;max-width:100%}.mbar a{white-space:nowrap;font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--txt2)}.mbar a.on{background:var(--txt);color:#fff;border-color:var(--txt)}.hd{padding:12px 16px}.hd .ac{display:none}.hd .r .txt{display:none}.trilha{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<script>try{if(window.self!==window.top||/[?&]embed=1/.test(location.search))document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<header><div class="hd">
  <a href="#comunidade"><img src="../assets/logo-provou-colorido.png" alt="Provou Levou"></a><span class="ac">Academy</span>
  <div class="r"><a href="../login/" class="hide" id="voltar"><i class="ti ti-layout-dashboard"></i><span class="txt"> Meu painel</span></a><div class="av" id="meuav">·</div><button class="btn gh hide" id="sair" title="Sair"><i class="ti ti-logout"></i></button></div>
</div></header>

<section class="auth hide" id="v-login"><div class="card">
  <img src="../assets/logo-provou-colorido.png" alt="Provou Levou" style="height:28px">
  <h2 class="hn" style="margin:18px 0 4px">Provou Academy</h2>
  <p style="color:var(--txt2);margin:0 0 14px;font-size:14px">Entre com o mesmo e-mail e senha do seu painel Provou Levou.</p>
  <form id="f-login" class="form">
    <label>E-mail<input type="email" id="l-email" required autocomplete="email"></label>
    <label>Senha<input type="password" id="l-senha" required autocomplete="current-password"></label>
    <button class="btn pri" style="justify-content:center;margin-top:6px" type="submit">Entrar</button>
    <div class="err" id="l-err"></div>
  </form>
</div></section>

<section class="auth hide" id="v-fora"><div class="card" style="text-align:center">
  <h2 class="hn" style="margin:6px 0">A Academy é para lojistas Provou Levou</h2>
  <p style="color:var(--txt2);font-size:14px">Este login não está ligado a nenhuma loja. Fale com a gente para liberar o acesso.</p>
  <a class="btn sec" href="https://wa.me/5511938034714?text=Quero%20acessar%20a%20Provou%20Academy" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp"></i>Falar com o time</a>
</div></section>

<div id="v-app" class="hide">
  <div class="mbar" id="mbar" style="margin-top:12px"></div>
  <div class="wrap">
    <aside class="lado" id="menu"></aside>
    <main id="principal"></main>
    <aside class="dir">
      <div class="card meu" id="minha-placa"></div>
      <div class="card"><h3>Próximos encontros</h3><div id="agenda"></div></div>
    </aside>
  </div>
</div>

<script>
const sb = window.supabase.createClient((window.ENV && window.ENV.SUPABASE_URL) || 'https://quantic-supabase.k5jwra.easypanel.host', window.ENV.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const ini = n => String(n || '?').replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/).slice(0, 2).map(p => p[0] || '').join('').toUpperCase() || '?';
const PLACAS = [5000, 10000, 20000, 50000, 100000, 500000, 1000000];
const placaTxt = p => p >= 1000000 ? '1 milhão' : (p / 1000) + ' mil';
const quando = d => { const s = (Date.now() - new Date(d)) / 1000; if (s < 3600) return 'há ' + Math.max(1, Math.round(s / 60)) + ' min'; if (s < 86400) return 'há ' + Math.round(s / 3600) + ' h'; if (s < 604800) return 'há ' + Math.round(s / 86400) + ' dias'; return new Date(d).toLocaleDateString('pt-BR'); };
const dataEv = d => new Date(d).toLocaleString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const ytId = u => { const m = String(u || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : null; };
const video = u => { if (/\.mp4(\?|$)/i.test(String(u || ''))) return `<div class="vidv"><video controls playsinline preload="metadata" poster="${esc(String(u).replace(/\.mp4(\?.*)?$/i, '.jpg'))}" src="${esc(u)}"></video></div>`; const id = ytId(u); return id ? `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen loading="lazy" title="Vídeo"></iframe></div>` : (u ? `<a class="btn sec" href="${esc(u)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>Abrir link</a>` : ''); };
const msg = e => (e && e.message ? e.message : String(e)).replace(/^.*?:\s*(?=[A-ZÁÉÍÓÚ])/, '');
let ME = null, ROTA = 'comunidade', FILTRO = null;

const MENU = [['comunidade', 'ti-home', 'Comunidade'], ['lives', 'ti-broadcast', 'Lives'], ['aulas', 'ti-player-play', 'Aulas'], ['cases', 'ti-trophy', 'Cases'], ['calls', 'ti-users-group', 'Calls'], ['placas', 'ti-award', 'Minhas placas'], ['afiliados', 'ti-users-plus', 'Indique e ganhe']];
const GRUPOS = [['oticas', 'ti-eyeglass', 'Óticas'], ['moda', 'ti-shirt', 'Moda'], ['comecando', 'ti-plant-2', 'Começando agora']];
function desenhaMenu() {
  const a = (r, i, t) => `<a href="#${r}" class="${ROTA === r ? 'on' : ''}"><i class="ti ${i}"></i>${t}</a>`;
  $('menu').innerHTML = MENU.map(m => a(...m)).join('') + '<h5>Grupos</h5>' + GRUPOS.map(g => a('g-' + g[0], g[1], g[2])).join('');
  $('mbar').innerHTML = MENU.concat(GRUPOS.map(g => ['g-' + g[0], g[1], g[2]])).map(m => `<a href="#${m[0]}" class="${ROTA === m[0] ? 'on' : ''}">${m[2]}</a>`).join('');
}

async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw error; return data; }

/* ---------- coluna da direita ---------- */
function desenhaPlaca() {
  const v = Number(ME.vendido || 0), prox = PLACAS.find(p => p > v), feitas = PLACAS.filter(p => p <= v).length;
  const base = PLACAS.filter(p => p <= v).pop() || 0, pct = prox ? Math.round((v - base) / (prox - base) * 100) : 100;
  $('minha-placa').innerHTML = ME.admin ? `<div style="font-size:13px;opacity:.85">Você está como</div><div class="v hn">Time Provou</div><div style="font-size:13px;opacity:.9">Pode publicar avisos, lives, aulas e moderar.</div>`
    : `<div style="font-size:13px;opacity:.85">${prox ? 'Sua próxima placa: R$ ' + placaTxt(prox) : 'Você chegou à placa de 1 milhão!'}</div>
       <div class="v hn">${brl(v)}</div><div style="font-size:13px;opacity:.9">vendidos com o provador</div>
       <div class="br"><i style="width:${pct}%"></i></div>
       <div style="font-size:12.5px;opacity:.85">${prox ? 'Faltam ' + brl(prox - v) + ' · ' : ''}${feitas} placa${feitas === 1 ? '' : 's'} conquistada${feitas === 1 ? '' : 's'}</div>`;
}
async function desenhaAgenda() {
  const d = await rpc('academy_eventos_lista');
  const prox = d.proximos.slice(0, 4);
  $('agenda').innerHTML = prox.length ? prox.map(e => { const dt = new Date(e.quando); return `<div class="ev"><div class="dt"><b>${dt.getDate()}</b><span>${dt.toLocaleString('pt-BR', { month: 'short' }).replace('.', '')}</span></div><div><h4>${esc(e.titulo)}</h4><p>${dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} · ${({ live: 'Live', call: 'Call com lojista', plantao: 'Plantão de dúvidas' })[e.tipo]}</p></div><button class="sino ${e.lembrete ? 'on' : ''}" data-lembrar="${e.id}" title="Me lembrar"><i class="ti ti-bell${e.lembrete ? '-ringing' : ''}"></i></button></div>`; }).join('')
    : '<div class="vazio" style="padding:10px">Nenhum encontro marcado ainda.</div>';
  return d;
}
async function desenhaMural() {
  const m = await rpc('academy_mural');
  const cor = p => p >= 100000 ? 'var(--ouro)' : p >= 20000 ? 'var(--roxo2)' : 'var(--ok)';
  $('mural').innerHTML = m.length ? m.slice(0, 10).map((r, i) => `<div class="rk"><span class="p">${i + 1}</span><div class="av" style="width:30px;height:30px;font-size:11px">${esc(ini(r.loja))}</div><b>${esc(r.loja)}</b><span class="pl" style="color:${cor(r.placa)}">${placaTxt(r.placa)}</span></div>`).join('')
    : '<div class="vazio" style="padding:10px">As primeiras placas aparecem aqui.</div>';
}

/* ---------- feed ---------- */

      <button class="btn pri" type="submit" style="justify-self:start">Indicar loja</button><div class="err" id="i-err"></div></form>
      ${(d.indicacoes || []).length ? `<table class="tab" style="margin-top:12px"><tr><th>Loja</th><th>Indicada em</th><th>Situação</th></tr>${d.indicacoes.map(i => `<tr><td>${esc(i.loja)}</td><td>${new Date(i.quando).toLocaleDateString('pt-BR')}</td><td>${i.situacao === 'cliente' ? '<span class="badge b-duv" style="margin:0">Virou cliente</span>' : '<span class="badge b-of" style="margin:0">Em negociação</span>'}</td></tr>`).join('')}</table>` : ''}</div>
    <div class="card" style="margin-bottom:16px"><h3 style="margin:0 0 10px;font-size:15.5px">Suas comissões</h3>${com.length ? `<div style="overflow-x:auto"><table class="tab"><tr><th>Data</th><th>Loja</th><th>De onde veio</th><th class="n">%</th><th class="n">Comissão</th><th>Situação</th></tr>${com.map(c => `<tr><td>${new Date(String(c.data).length <= 10 ? c.data + 'T12:00:00' : c.data).toLocaleDateString('pt-BR')}</td><td>${esc(c.loja)}</td><td>${ORI[c.nivel] || c.nivel}${c.nivel !== 'L1' && c.vendedor ? ' · ' + esc(prim(c.vendedor)) : ''}</td><td class="n">${Number(c.rate)}%</td><td class="n"><b>${brl2(c.valor)}</b></td><td>${c.status === 'pago' ? 'Pago' : 'A receber'}</td></tr>`).join('')}</table></div>` : '<div class="vazio" style="padding:10px">As comissões aparecem aqui quando uma loja da sua rede pagar.</div>'}</div>
    <div class="card"><h3 style="margin:0 0 4px;font-size:15.5px">Como você ganha</h3><p style="color:var(--txt2);font-size:13.5px;margin:0">Comissão sobre a mensalidade da loja, <b>enquanto o cliente estiver ativo</b>. O ganho vai até o 3º nível.</p>${REGRA}</div>`;
  $('afcopia').onclick = async () => { try { await navigator.clipboard.writeText($('aflink').value); $('afcopia').textContent = 'Copiado!'; } catch { $('aflink').select(); } };
  $('f-ind').onsubmit = async ev => { ev.preventDefault(); $('i-err').textContent = '';
    try { await rpc('pl_afiliado_indicar', { p_loja: $('i-loja').value, p_site: $('i-site').value, p_email: $('i-email').value, p_whatsapp: $('i-whats').value }); paginaAfiliados(); } catch (e) { $('i-err').textContent = msg(e); } };
}

/* ---------- rotas e eventos ---------- */
async function rota() {
  ROTA = (location.hash || '#comunidade').slice(1) || 'comunidade'; desenhaMenu();
  try {
    if (ROTA === 'comunidade') await feed(null, null);
    else if (ROTA === 'cases') await feed('case', null, 'Cases de sucesso', 'Lojistas mostrando o que fizeram e os números que conseguiram.');
    else if (ROTA === 'lives') await paginaEventos(['live'], 'Lives', 'Ao vivo com o time Provou. As gravações ficam aqui embaixo.');
    else if (ROTA === 'calls') await paginaEventos(['call', 'plantao'], 'Calls com lojistas', 'Lojistas que já vendem muito com o provador conversando com quem está começando.');
    else if (ROTA === 'aulas') await paginaAulas();
    else if (ROTA === 'placas') paginaPlacas();
    else if (ROTA === 'afiliados') await paginaAfiliados();
    else if (ROTA.startsWith('g-')) { const g = GRUPOS.find(x => 'g-' + x[0] === ROTA); await feed(null, g[0], 'Grupo ' + g[2], 'Conversas e cases de lojas parecidas com a sua.'); }
  } catch (e) { $('principal').innerHTML = `<div class="card vazio">Não foi possível carregar agora. ${esc(msg(e))}</div>`; }
  window.scrollTo(0, 0);
}
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button,[data-aula]'); if (!t) return;
  try {
    if (t.dataset.filtro !== undefined) { FILTRO = t.dataset.filtro || null; rota(); }
    else if (t.dataset.curtir) { const r = await rpc('academy_curtir', { p_post: t.dataset.curtir }); const n = +t.textContent.trim() + (r.curti ? 1 : -1); t.classList.toggle('liked', r.curti); t.innerHTML = `<i class="ti ti-heart"></i>${n}`; }
    else if (t.dataset.coms) { const b = $('c-' + t.dataset.coms); if (!b.classList.contains('hide') && b.innerHTML) b.classList.add('hide'); else abreComentarios(t.dataset.coms); }
    else if (t.dataset.lembrar) { await rpc('academy_lembrar', { p_evento: t.dataset.lembrar }); desenhaAgenda(); if (ROTA !== 'aulas' && ROTA !== 'placas') rota(); }
    else if (t.dataset.fixar) { await rpc('academy_admin', { p_acao: 'fixar', p_id: t.dataset.fixar }); rota(); }
    else if (t.dataset.apagar) { if (confirm('Apagar este post?')) { await rpc('academy_admin', { p_acao: 'apagar_post', p_id: t.dataset.apagar }); rota(); } }
    else if (t.dataset.apagacom) { if (confirm('Apagar este comentário?')) { await rpc('academy_admin', { p_acao: 'apagar_comentario', p_id: t.dataset.apagacom }); abreComentarios(t.dataset.post); } }
    else if (t.dataset.gravacao) { const u = prompt('Link da gravação (YouTube):'); if (u) { await rpc('academy_admin', { p_acao: 'gravacao', p_id: t.dataset.gravacao, p_dados: { url: u } }); rota(); } }
    else if (t.dataset.aula) { const p = $('pl-' + t.dataset.aula); p.classList.toggle('hide'); if (!p.innerHTML) { p.innerHTML = video(t.dataset.url); rpc('academy_aula_vista', { p_aula: t.dataset.aula }); } }
  } catch (e) { alert(msg(e)); }
});
document.addEventListener('submit', async ev => {
  const f = ev.target; if (!f.dataset.comentar) return; ev.preventDefault();
  const i = f.querySelector('input'); try { await rpc('academy_comentar', { p_post: f.dataset.comentar, p_texto: i.value }); abreComentarios(f.dataset.comentar); } catch (e) { alert(msg(e)); }
});
window.addEventListener('hashchange', () => { FILTRO = null; rota(); });
$('f-login').onsubmit = async ev => { ev.preventDefault(); $('l-err').textContent = ''; const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim().toLowerCase(), password: $('l-senha').value }); if (error) $('l-err').textContent = 'E-mail ou senha incorretos.'; else iniciar(); };
$('sair').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  ['v-login', 'v-fora', 'v-app'].forEach(v => $(v).classList.add('hide'));
  if (!session) { $('v-login').classList.remove('hide'); return; }
  $('sair').classList.remove('hide');
  try { ME = await rpc('academy_me'); } catch (e) { ME = null; }
  if (!ME || !ME.membro) { $('v-fora').classList.remove('hide'); return; }
  $('v-app').classList.remove('hide'); $('voltar').classList.remove('hide');
  $('meuav').textContent = ME.admin ? 'PL' : ini(ME.nome); $('meuav').classList.toggle('of', !!ME.admin); $('meuav').title = ME.nome;
  desenhaPlaca(); desenhaAgenda().catch(() => {}); rota();
}
iniciar();
</script>
</body></html>
