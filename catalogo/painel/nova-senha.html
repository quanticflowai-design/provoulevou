<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Criar nova senha · Provou Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=150">
</head>
<body>
  <!-- Link de redefinição de senha do lojista. O link é gerado pela Provou Levou
       (GoTrue admin generate_link, type=recovery) e chega aqui como #t=<hashed_token>.
       O código vai no HASH de propósito: a prévia do WhatsApp não lê o hash nem roda
       JS, então não "gasta" o link antes do lojista clicar. O código só é usado no
       envio do formulário (POST /auth/v1/verify -> sessão -> PUT /auth/v1/user).
       Não depende do redirect do GoTrue (API_EXTERNAL_URL do self-hosted é localhost). -->
  <div id="app">
    <section class="screen active" id="screen-login" data-screen="login">
      <div class="login-box">
        <img class="login-logo" src="../logo.png" alt="Provou Catálogo">
        <h2>Criar nova senha</h2>
        <p class="muted" id="ns-intro">Escolha a senha que você vai usar para entrar no painel do seu catálogo.</p>
        <form id="login-form" autocomplete="on">
          <label for="ns-pass">Nova senha</label>
          <input type="password" id="ns-pass" autocomplete="new-password" placeholder="mínimo 8 caracteres" minlength="8" required>
          <label for="ns-pass2">Repita a nova senha</label>
          <input type="password" id="ns-pass2" autocomplete="new-password" placeholder="digite de novo" minlength="8" required>
          <p class="field-error" id="ns-error" hidden></p>
          <button class="btn-primary big" id="ns-btn" type="submit">Salvar nova senha</button>
        </form>
        <div id="ns-ok" hidden>
          <p class="muted">✅ Senha alterada! Agora é só entrar com o seu e-mail e a senha nova.</p>
          <a class="btn-primary big" href="./" style="display:block;text-align:center;text-decoration:none">Entrar no painel</a>
        </div>
        <p class="mini-note">Problemas com o link? Chame a Provou Levou no WhatsApp.</p>
      </div>
    </section>
  </div>
  <script>
  (() => {
    'use strict';
    const SB_URL = 'https://quantic-supabase.k5jwra.easypanel.host';
    const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.pCFnSnrlSUM2EwXi9gxAegpoC-9U0Mjx3iAtROR-E20';
    const $ = s => document.querySelector(s);
    const token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
    const erro = msg => { const e = $('#ns-error'); e.textContent = msg; e.hidden = !msg; };

    if (!token) {
      $('#login-form').hidden = true;
      $('#ns-intro').textContent = 'Este link está incompleto. Peça um novo link à Provou Levou pelo WhatsApp.';
      return;
    }

    $('#login-form').addEventListener('submit', async ev => {
      ev.preventDefault();
      const p1 = $('#ns-pass').value, p2 = $('#ns-pass2').value;
      if (p1.length < 8) return erro('A senha precisa ter pelo menos 8 caracteres.');
      if (p1 !== p2) return erro('As duas senhas não são iguais.');
      erro('');
      const btn = $('#ns-btn'); btn.disabled = true; btn.textContent = 'Salvando…';
      try {
        const v = await fetch(SB_URL + '/auth/v1/verify', {
          method: 'POST', headers: { apikey: SB_ANON, 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'recovery', token_hash: token })
        });
        const s = await v.json().catch(() => null);
        if (!v.ok || !s || !s.access_token) {
          throw new Error('Este link expirou ou já foi usado. Peça um novo à Provou Levou pelo WhatsApp.');
        }
        const u = await fetch(SB_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: { apikey: SB_ANON, Authorization: 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: p1 })
        });
        if (!u.ok) {
          const j = await u.json().catch(() => null);
          throw new Error((j && (j.msg || j.error_description)) || 'Não consegui salvar a senha. Tente de novo.');
        }
        history.replaceState(null, '', location.pathname);   // tira o código da barra de endereço
        $('#login-form').hidden = true; $('#ns-intro').hidden = true; $('#ns-ok').hidden = false;
      } catch (e) {
        erro(e.message || 'Não consegui salvar a senha. Tente de novo.');
        btn.disabled = false; btn.textContent = 'Salvar nova senha';
      }
    });
  })();
  </script>
</body>
</html>
